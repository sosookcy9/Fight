<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>海上戰鬥機</title>
<style>
:root{box-sizing:border-box;--amber:#ffc266;--ink:#0b0d1a}
*{box-sizing:border-box}
html,body{height:100%;margin:0;background:#0b0d1a;overflow:hidden;overscroll-behavior:none;font-family:-apple-system,"PingFang TC","Noto Sans TC",sans-serif;color:#fff;touch-action:none;user-select:none;-webkit-user-select:none}
canvas{position:fixed;inset:0;width:100%;height:100%;display:block}
.btn{position:fixed;bottom:calc(env(safe-area-inset-bottom,0px) + 18px);width:76px;height:76px;border-radius:50%;border:2px solid var(--amber);background:rgba(11,13,26,.7);color:var(--amber);font-size:15px;font-weight:600}
.btn:active{background:var(--amber);color:var(--ink)}
#slow{left:16px}#fast{right:16px}
#fire{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom,0px) + 18px);width:76px;height:76px;border-radius:50%;border:2px solid rgba(255,92,92,.55);background:rgba(11,13,26,.7);color:#ff9090;font-size:13px;font-weight:700;line-height:1.3}
#fire.on{background:#ff5c5c;color:#fff;border-color:#ff5c5c;box-shadow:0 0 18px rgba(255,92,92,.7)}
#thr{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom,0px) + 102px);width:110px;height:5px;background:rgba(255,194,102,.25);pointer-events:none}
#thr i{display:block;height:100%;background:var(--amber);width:40%}
#topbar{position:fixed;top:calc(env(safe-area-inset-top,0px) + 14px);left:0;right:0;display:flex;justify-content:space-between;align-items:flex-start;padding:0 14px;gap:10px}
.panel{background:rgba(10,16,30,.55);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);border:1px solid rgba(255,255,255,.14);border-radius:14px;padding:8px 14px;box-shadow:0 4px 14px rgba(0,0,0,.25)}
#score{color:#fff;font:700 16px ui-monospace,Menlo,monospace;display:block}
#shield{display:flex;gap:4px;margin-top:6px}
#shield i{width:14px;height:8px;border-radius:3px;background:#39ff9c;box-shadow:0 0 6px #39ff9c;display:block}
#shield i.off{background:rgba(255,255,255,.16);box-shadow:none}
#stats{color:var(--amber);font:600 13px ui-monospace,Menlo,monospace;text-align:right;white-space:nowrap}
#viewBtn{margin-top:8px;padding:6px 12px;border-radius:10px;border:1px solid rgba(255,194,102,.5);background:rgba(11,13,26,.65);color:var(--amber);font-size:13px;font-weight:600;pointer-events:auto}
#cross{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);width:46px;height:46px;pointer-events:none}
#cross::before,#cross::after{content:'';position:absolute;background:rgba(255,194,102,.85)}
#cross::before{left:50%;top:0;width:2px;height:100%;transform:translateX(-1px)}
#cross::after{top:50%;left:0;height:2px;width:100%;transform:translateY(-1px)}
#cross i{position:absolute;inset:11px;border:2px solid rgba(255,194,102,.85);border-radius:50%}
#cross.chase{top:38%}
#levelToast{position:fixed;top:25%;left:50%;transform:translate(-50%,-8px);padding:12px 22px;border:1px solid rgba(255,226,151,.7);border-radius:14px;background:rgba(17,31,54,.78);color:#ffe09d;font:700 22px -apple-system,"PingFang TC",sans-serif;white-space:nowrap;text-shadow:0 0 13px #ffb756;box-shadow:0 0 24px rgba(255,178,71,.3);opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;z-index:6}
#levelToast.show{opacity:1;transform:translate(-50%,0)}
#flash{position:fixed;inset:0;background:#ff3050;opacity:0;pointer-events:none;transition:opacity .08s}
#joy{position:fixed;width:96px;height:96px;border-radius:50%;border:2px solid rgba(255,194,102,.5);pointer-events:none;display:none}
#joy i{position:absolute;width:40px;height:40px;border-radius:50%;background:rgba(255,194,102,.55);left:28px;top:28px;transition:left .05s,top .05s}
.pop{position:fixed;color:#fff;font:700 16px ui-monospace,Menlo,monospace;text-shadow:0 0 6px #000;pointer-events:none;transition:transform .8s ease-out,opacity .8s ease-out;z-index:5}
#crash{position:fixed;inset:0;background:rgba(255,80,50,.4);display:none;align-items:center;justify-content:center;font-size:28px;font-weight:700}
#ov{position:fixed;inset:0;display:flex;flex-direction:column;justify-content:center;padding:32px;background:linear-gradient(#2e7bc9,#bfe4f5 65%,#eaf7ff);gap:14px}
#ov h1{font-size:34px;margin:0;color:#0b2a4a}
#ov p{margin:0;line-height:1.6;font-size:16px;max-width:34ch;color:#0b2a4a}
#go{margin-top:8px;padding:16px;border:0;border-radius:12px;background:#ff5c5c;color:#fff;font-size:18px;font-weight:700}
</style>
</head>
<body>
<div id="topbar" hidden><div class="panel"><span id="score">分數 0</span><div id="shield"><i></i><i></i><i></i><i></i><i></i></div></div><div><div class="panel" id="stats"></div><button id="viewBtn">🎥 機外視角</button></div></div>
<div id="cross" class="chase" hidden><i></i></div>
<div id="levelToast" role="status" aria-live="polite"></div>
<div id="flash"></div>
<div id="joy"><i></i></div>
<div id="thr" hidden><i></i></div>
<button class="btn" id="slow" hidden>減速</button>
<button id="fire" hidden>自動射擊<br>關</button>
<button class="btn" id="fast" hidden>加速</button>
<div id="crash">墜海！重新起飛中</div>
<div id="ov">
<h1>海上戰鬥機</h1>
<p>晴空萬里，海面上的空戰。手指拖曳螢幕：左右拖＝滾轉轉彎，上下拖＝拉升／俯衝，放開回正。</p>
<p>左下「減速」、右下「加速」控制油門，中間按鈕切換自動射擊。擊落敵機可升到 7 級，從第 2 級起命中會濺射附近敵機。右上角可切換座艙／機外視角，準心指向子彈飛行方向。你有 5 格護盾，被擊中扣一格，連續 8 秒沒被打中會回一格。護盾歸零或掉進海裡會重新起飛。</p>
<button id="go">開始飛行</button>
</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
const $=id=>document.getElementById(id),cl=(v,a,b)=>Math.max(a,Math.min(b,v)),rr=(a,b)=>a+Math.random()*(b-a);
const ren=new THREE.WebGLRenderer({antialias:true});ren.setPixelRatio(Math.min(devicePixelRatio,1.75));ren.setSize(innerWidth,innerHeight);ren.shadowMap.enabled=true;document.body.prepend(ren.domElement);
const scene=new THREE.Scene();scene.fog=new THREE.Fog(0xcfeaf7,500,2600);
const cam=new THREE.PerspectiveCamera(62,innerWidth/innerHeight,.5,6000);
addEventListener('resize',()=>{ren.setSize(innerWidth,innerHeight);cam.aspect=innerWidth/innerHeight;cam.updateProjectionMatrix()});
scene.add(new THREE.HemisphereLight(0xbfe0ff,0x2a5a7a,.9));
const sun=new THREE.DirectionalLight(0xfff6da,1.2);sun.castShadow=true;sun.shadow.mapSize.set(1024,1024);
Object.assign(sun.shadow.camera,{left:-90,right:90,top:90,bottom:-90,near:1,far:400});scene.add(sun,sun.target);
const SUN=new THREE.Vector3(.35,.55,-.6).normalize();
const sky=new THREE.Mesh(new THREE.SphereGeometry(4500,24,16),new THREE.ShaderMaterial({side:THREE.BackSide,depthWrite:false,
vertexShader:'varying vec3 v;void main(){v=normalize(position);gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.);}',
fragmentShader:'varying vec3 v;void main(){float h=max(v.y,0.);vec3 zen=vec3(.16,.48,.88),hor=vec3(.78,.9,.98);vec3 c=mix(hor,zen,pow(h,.5));c+=vec3(1.,.98,.85)*pow(max(dot(v,normalize(vec3(.35,.55,-.6))),0.),80.);gl_FragColor=vec4(c,1.);}'}));
sky.renderOrder=-1;scene.add(sky);
function tex(fn,s,rep){const c=document.createElement('canvas');c.width=c.height=s;const g=c.getContext('2d');fn(g,s);const t=new THREE.CanvasTexture(c);t.wrapS=t.wrapT=THREE.RepeatWrapping;t.anisotropy=4;if(rep)t.repeat.set(rep,rep);return t}
const toonGrad=(()=>{const c=document.createElement('canvas');c.width=4;c.height=1;const g=c.getContext('2d');[70,150,210,255].forEach((v,i)=>{g.fillStyle=`rgb(${v},${v},${v})`;g.fillRect(i,0,1,1)});const t=new THREE.CanvasTexture(c);t.minFilter=t.magFilter=THREE.NearestFilter;return t})();
function outline(mesh,s){const o=new THREE.Mesh(mesh.geometry,new THREE.MeshBasicMaterial({color:0x142033,side:THREE.BackSide}));o.scale.setScalar(s||1.12);mesh.add(o)}
const wtex=tex((g,s)=>{g.fillStyle='#1fb6c9';g.fillRect(0,0,s,s);g.fillStyle='#7fe6da';
 for(let k=0;k<9;k++){const x=Math.random()*s,y=Math.random()*s,r=18+Math.random()*36;g.beginPath();g.arc(x,y,r,0,7);g.fill()}},512,20);
const ocean=new THREE.Mesh(new THREE.PlaneGeometry(20000,20000),new THREE.MeshToonMaterial({map:wtex,color:0xbfeee8,gradientMap:toonGrad}));
ocean.rotation.x=-Math.PI/2;ocean.receiveShadow=true;scene.add(ocean);
const cloudMat=new THREE.MeshToonMaterial({color:0xffffff,gradientMap:toonGrad});
const CLOUDS=[];function placeCloud(c,ox,oz){c.position.set((ox||0)+rr(-1200,1200),rr(350,700),(oz||0)+rr(-1600,400))}
for(let k=0;k<12;k++){const g=new THREE.Group();for(let m=0;m<4;m++){const s=new THREE.Mesh(new THREE.SphereGeometry(1,8,6),cloudMat);s.scale.set(rr(30,55),rr(20,30),rr(30,55));s.position.set(rr(-25,25),rr(-6,6),rr(-20,20));g.add(s)}placeCloud(g,0,0);scene.add(g);CLOUDS.push(g)}
const expTex=tex((g,s)=>{const r=g.createRadialGradient(s/2,s/2,0,s/2,s/2,s/2);r.addColorStop(0,'#fff6c8');r.addColorStop(.4,'#ffb03c');r.addColorStop(1,'rgba(255,60,20,0)');g.fillStyle=r;g.fillRect(0,0,s,s)},128);
const EXP=Array.from({length:12},()=>{const m=new THREE.Sprite(new THREE.SpriteMaterial({map:expTex,transparent:true,depthWrite:false,fog:false}));m.visible=false;scene.add(m);return{mesh:m,life:0}});
function explode(pos,big){const e=EXP.find(x=>x.life<=0);if(!e)return;e.mesh.position.copy(pos);e.mesh.visible=true;e.mesh.material.opacity=1;e.big=big;e.life=big?.45:.16}
const splashTex=tex((g,s)=>{const r=g.createRadialGradient(s/2,s/2,s*.13,s/2,s/2,s*.5);r.addColorStop(0,'rgba(220,252,255,0)');r.addColorStop(.45,'rgba(132,233,255,.5)');r.addColorStop(.75,'rgba(89,210,255,.2)');r.addColorStop(1,'rgba(89,210,255,0)');g.fillStyle=r;g.fillRect(0,0,s,s)},128);
const SPLASH=Array.from({length:24},()=>{const mesh=new THREE.Sprite(new THREE.SpriteMaterial({map:splashTex,transparent:true,depthWrite:false,fog:false,blending:THREE.AdditiveBlending}));mesh.visible=false;scene.add(mesh);return{mesh,life:0,radius:0}});
function splashAt(pos,radius){const s=SPLASH.find(x=>x.life<=0);if(!s)return;s.mesh.position.copy(pos);s.mesh.visible=true;s.mesh.material.opacity=.85;s.mesh.scale.setScalar(radius*.65);s.radius=radius;s.life=.28}
function popup(text,pos){const v=pos.clone().project(cam);const x=(v.x*.5+.5)*innerWidth,y=(-v.y*.5+.5)*innerHeight;
 const el=document.createElement('div');el.className='pop';el.textContent=text;el.style.left=x+'px';el.style.top=y+'px';document.body.appendChild(el);
 requestAnimationFrame(()=>{el.style.transform='translateY(-40px)';el.style.opacity='0'});setTimeout(()=>el.remove(),850)}
function buildJet(cMain,cDark,cCan){
 const g=new THREE.Group(),jm=new THREE.MeshToonMaterial({color:cMain,gradientMap:toonGrad}),dm=new THREE.MeshToonMaterial({color:cDark,gradientMap:toonGrad});
 const add=(geo,m,x,y,z,rx=0,rz=0)=>{const o=new THREE.Mesh(geo,m);o.position.set(x,y,z);o.rotation.set(rx,0,rz);o.castShadow=true;outline(o);g.add(o);return o};
 add(new THREE.SphereGeometry(1.55,10,8),jm,0,0,1).scale.set(1,1,3.1);
 add(new THREE.ConeGeometry(1.4,3,10),jm,0,0,-5.6,-Math.PI/2);
 const can=add(new THREE.SphereGeometry(.95,10,8),new THREE.MeshToonMaterial({color:cCan,gradientMap:toonGrad}),0,1.05,-1.5);can.scale.set(1,.85,1.9);
 const sh=new THREE.Shape();sh.moveTo(0,-2.5);sh.lineTo(6.2,2.2);sh.lineTo(6.2,3.8);sh.lineTo(0,4.2);
 const wg=new THREE.ExtrudeGeometry(sh,{depth:.5,bevelEnabled:false});
 const w2=add(wg,dm,0,0,-.5,Math.PI/2);w2.scale.x=-1;add(wg,dm,0,0,-.5,Math.PI/2);
 const s2=add(wg,dm,0,0,3.2,Math.PI/2);s2.scale.set(-.42,.42,.42);const s1=add(wg,dm,0,0,3.2,Math.PI/2);s1.scale.set(.42,.42,.42);
 add(new THREE.BoxGeometry(.3,2.6,2.2),jm,1,1.9,3.8,0,-.3);add(new THREE.BoxGeometry(.3,2.6,2.2),jm,-1,1.9,3.8,0,.3);
 const fl=new THREE.Mesh(new THREE.ConeGeometry(.85,1,8).translate(0,.5,0),new THREE.MeshBasicMaterial({color:0xffb03c,transparent:true,opacity:.9,fog:false}));fl.rotation.x=Math.PI/2;fl.position.z=5.6;g.add(fl);
 g.rotation.order='YXZ';return{group:g,flame:fl}}
const player=buildJet(0x3a7bd8,0x1f4e99,0x162a4a);scene.add(player.group);
const jet=player.group,fl=player.flame;
// enemies
const EN=[];function spawnEnemy(e){e.center=new THREE.Vector3(rr(-500,500),rr(200,420),rr(-1000,-200));e.radius=rr(70,150);e.speed=rr(.25,.55)*(Math.random()<.5?1:-1);e.angle=rr(0,6.28);e.yaw=0;e.px=e.py=e.pz=null;e.cd=rr(1,3);e.hp=4}
for(let k=0;k<12;k++){const j=buildJet(0xe23c3c,0x9a1f1f,0x2a1010);scene.add(j.group);const e={group:j.group,flame:j.flame};spawnEnemy(e);EN.push(e)}
// bullets
const MATC=[0xffcf7a,0xffad5c,0xffde7a,0xff8a4b,0x9de8ff,0x62d8ff,0xd0faff].map(c=>new THREE.MeshBasicMaterial({color:c,fog:false,transparent:true,blending:THREE.AdditiveBlending,depthWrite:false}));
const BUL=Array.from({length:100},()=>({mesh:new THREE.Mesh(new THREE.CylinderGeometry(.22,.22,6,6),MATC[0]),active:false,vel:new THREE.Vector3(),life:0,dmg:0,radius:0,splash:0}));
BUL.forEach(b=>{b.mesh.visible=false;b.mesh.geometry.rotateX(Math.PI/2);scene.add(b.mesh)});
let score=0,cooldown=0,autoFire=false,kills=0,lvl=1,viewMode='chase';
const LV=[
 {g:[-1.7,1.7],cd:.16,sc:1,len:1,dmg:1,radius:0,splash:0},
 {g:[-1.7,1.7],cd:.14,sc:1.05,len:1.05,dmg:1,radius:22,splash:1},
 {g:[-1.9,0,1.9],cd:.16,sc:1.1,len:1.15,dmg:1,radius:28,splash:1},
 {g:[-1.9,0,1.9],cd:.14,sc:1.2,len:1.2,dmg:2,radius:34,splash:1},
 {g:[-1.9,0,1.9],cd:.105,sc:1.25,len:1.3,dmg:2,radius:42,splash:1},
 {g:[-3.2,-1.7,0,1.7,3.2],cd:.15,sc:1.25,len:1.4,dmg:2,radius:48,splash:2},
 {g:[-3.2,-1.7,0,1.7,3.2],cd:.105,sc:1.4,len:1.65,dmg:3,radius:60,splash:2}
];
let levelToastTimer=0;
function checkLevel(){while(lvl<7&&kills>=lvl*5){lvl++;$('levelToast').textContent=`火力升級 Lv.${lvl}`;$('levelToast').classList.add('show');clearTimeout(levelToastTimer);levelToastTimer=setTimeout(()=>$('levelToast').classList.remove('show'),1600)}}
const UP=new THREE.Vector3(0,1,0),side=new THREE.Vector3();
function fireOne(off,c){const b=BUL.find(x=>!x.active);if(!b)return;
 const cp=Math.cos(st.pitch),dir=new THREE.Vector3(-Math.sin(st.yaw)*cp,Math.sin(st.pitch),-Math.cos(st.yaw)*cp);
 side.set(Math.cos(st.yaw),0,-Math.sin(st.yaw));
 b.mesh.position.copy(P).addScaledVector(dir,6).addScaledVector(side,off).addScaledVector(UP,-.5);
 b.mesh.quaternion.setFromUnitVectors(new THREE.Vector3(0,0,1),dir);b.mesh.scale.set(c.sc,c.sc,c.len);b.mesh.material=MATC[lvl-1];b.dmg=c.dmg;b.radius=c.radius;b.splash=c.splash;
 b.vel.copy(dir).multiplyScalar(460);b.life=1.6;b.active=true;b.mesh.visible=true}
function fire(){const c=LV[lvl-1];c.g.forEach(o=>fireOne(o,c))}
const eTex=new THREE.MeshBasicMaterial({color:0xff2a4a,fog:false,transparent:true,blending:THREE.AdditiveBlending,depthWrite:false});
const ENBUL=Array.from({length:20},()=>({mesh:new THREE.Mesh(new THREE.CylinderGeometry(.2,.2,5,6),eTex),active:false,vel:new THREE.Vector3(),life:0}));
ENBUL.forEach(b=>{b.mesh.visible=false;b.mesh.geometry.rotateX(Math.PI/2);scene.add(b.mesh)});
function enemyFire(e){const b=ENBUL.find(x=>!x.active);if(!b)return;
 const d=new THREE.Vector3().subVectors(P,e.group.position).normalize();
 b.mesh.position.copy(e.group.position).addScaledVector(d,4);b.mesh.quaternion.setFromUnitVectors(new THREE.Vector3(0,0,1),d);
 b.vel.copy(d).multiplyScalar(300);b.life=2.5;b.active=true;b.mesh.visible=true}
// state
const P=new THREE.Vector3(0,320,300),st={yaw:0,pitch:0,roll:0,v:70,th:.4,crash:0,tR:0,tP:0};
let dir=0,drag=false,touchId=null,startX=0,startY=0,last=0,t0=0,shield=5,noHit=0;
const joy=$('joy'),joyKnob=joy.firstElementChild,shieldEl=$('shield');
function updateShield(){[...shieldEl.children].forEach((el,i)=>el.classList.toggle('off',i>=shield))}
function defeatEnemy(e){score+=10;kills++;checkLevel();explode(e.group.position,true);popup('+10',e.group.position);$('score').textContent='分數 '+score;spawnEnemy(e)}
function hitPlayer(){if(st.crash>0)return;shield--;noHit=0;updateShield();$('flash').style.opacity=.55;setTimeout(()=>$('flash').style.opacity=0,90);
 if(shield<=0){st.crash=1.6;jet.visible=false;$('crash').style.display='flex'}}
function reset(){P.set(0,320,300);Object.assign(st,{yaw:0,pitch:0,roll:0,v:70,th:.4,crash:0,tR:0,tP:0});jet.visible=true;$('crash').style.display='none';cam.position.set(0,326,322);shield=5;noHit=0;updateShield()}
function start(){$('ov').style.display='none';['slow','fast','fire','thr','topbar','cross'].forEach(i=>$(i).hidden=false);setFireBtn();reset();last=performance.now();ren.setAnimationLoop(loop)}
$('go').onclick=start;
const hold=(b,d)=>{b.addEventListener('pointerdown',e=>{e.stopPropagation();dir=d});['pointerup','pointercancel','pointerleave'].forEach(t=>b.addEventListener(t,()=>dir=0))};hold($('fast'),1);hold($('slow'),-1);
function setFireBtn(){$('fire').classList.toggle('on',autoFire);$('fire').innerHTML='自動射擊<br>'+(autoFire?'開':'關')}
$('fire').addEventListener('click',()=>{autoFire=!autoFire;setFireBtn()});
$('viewBtn').addEventListener('click',e=>{e.stopPropagation();viewMode=viewMode==='chase'?'cockpit':'chase';$('viewBtn').textContent=viewMode==='chase'?'🎥 機外視角':'🎥 座艙視角';$('cross').classList.toggle('chase',viewMode==='chase')});
ren.domElement.addEventListener('pointerdown',e=>{drag=true;touchId=e.pointerId;startX=e.clientX;startY=e.clientY;
 joy.style.left=(startX-48)+'px';joy.style.top=(startY-48)+'px';joy.style.display='block';joyKnob.style.left='28px';joyKnob.style.top='28px'});
addEventListener('pointerup',e=>{if(e.pointerId===touchId){drag=false;st.tR=0;st.tP=0;joy.style.display='none'}});
addEventListener('pointercancel',()=>{drag=false;st.tR=0;st.tP=0;joy.style.display='none'});
addEventListener('pointermove',e=>{if(drag&&e.pointerId===touchId){const dx=e.clientX-startX,dy=e.clientY-startY;
 st.tR=cl(dx/innerWidth*2.6,-1.4,1.4);st.tP=cl(-dy/innerHeight*1.7,-.87,.87);
 const kd=Math.min(34,Math.hypot(dx,dy)),ang=Math.atan2(dy,dx);joyKnob.style.left=(28+Math.cos(ang)*kd)+'px';joyKnob.style.top=(28+Math.sin(ang)*kd)+'px'}});
const fwd=new THREE.Vector3(),want=new THREE.Vector3(),ahead=new THREE.Vector3();
function loop(now){const dt=Math.min(.05,(now-last)/1000);last=now;t0+=dt;
 if(st.crash>0){st.crash-=dt;if(st.crash<=0)reset()}else{
  st.th=cl(st.th+dir*dt*.6,.05,1);st.v+=((40+st.th*130)-st.v)*Math.min(1,dt*1.5);
  const k=Math.min(1,dt*5);st.roll+=(st.tR-st.roll)*k;st.pitch+=(st.tP-st.pitch)*k;st.yaw-=Math.sin(st.roll)*dt*1.1;
  const cp=Math.cos(st.pitch);fwd.set(-Math.sin(st.yaw)*cp,Math.sin(st.pitch),-Math.cos(st.yaw)*cp);
  P.addScaledVector(fwd,st.v*dt);P.y=Math.min(900,P.y);
  cooldown-=dt;if(autoFire&&cooldown<=0){fire();cooldown=LV[lvl-1].cd}
  noHit+=dt;if(noHit>=8&&shield<5){shield++;noHit=0;updateShield()}
  if(P.y<3){st.crash=1.6;jet.visible=false;$('crash').style.display='flex'}}
 CLOUDS.forEach(c=>{if(Math.hypot(c.position.x-P.x,c.position.z-P.z)>1800)placeCloud(c,P.x,P.z)});
 EXP.forEach(e=>{if(e.life<=0)return;e.life-=dt;const dur=e.big?.45:.16,t=1-e.life/dur,base=e.big?6:3,grow=e.big?34:12;e.mesh.scale.setScalar(base+t*grow);e.mesh.material.opacity=1-t;if(e.life<=0)e.mesh.visible=false});
 SPLASH.forEach(s=>{if(s.life<=0)return;s.life-=dt;const t=1-Math.max(0,s.life)/.28;s.mesh.scale.setScalar(s.radius*(.65+t*1.5));s.mesh.material.opacity=.85*(1-t);if(s.life<=0)s.mesh.visible=false});
 jet.position.copy(P);jet.rotation.set(st.pitch,st.yaw,-st.roll);jet.visible=st.crash<=0&&viewMode!=='cockpit';
 const fs=.6+st.th*2.4;fl.scale.set(1,fs*(.85+Math.random()*.3),1);
 // enemies
 EN.forEach(e=>{e.angle+=e.speed*dt;const x=e.center.x+Math.cos(e.angle)*e.radius,z=e.center.z+Math.sin(e.angle)*e.radius,y=e.center.y+Math.sin(t0*.4+e.angle)*8;
  if(e.px!==null){const dx=x-e.px,dz=z-e.pz;if(Math.hypot(dx,dz)>.001)e.yaw=Math.atan2(-dx,-dz)}
  e.px=x;e.py=y;e.pz=z;
  e.group.position.set(x,y,z);e.group.rotation.set(0,e.yaw,.35*Math.sign(e.speed));
  e.flame.scale.set(1,1.4+Math.random()*.3,1);
  e.cd-=dt;if(e.cd<=0&&st.crash<=0&&P.distanceTo(e.group.position)<650){enemyFire(e);e.cd=rr(1.4,2.8)}});
 // enemy bullets
 ENBUL.forEach(b=>{if(!b.active)return;b.mesh.position.addScaledVector(b.vel,dt);b.life-=dt;
  if(b.life<=0||b.mesh.position.y<0){b.active=false;b.mesh.visible=false;return}
  if(st.crash<=0&&b.mesh.position.distanceTo(P)<9){b.active=false;b.mesh.visible=false;hitPlayer()}});
 // bullets
 BUL.forEach(b=>{if(!b.active)return;b.mesh.position.addScaledVector(b.vel,dt);b.life-=dt;
  if(b.life<=0||b.mesh.position.y<0){b.active=false;b.mesh.visible=false;return}
  for(const e of EN){if(b.mesh.position.distanceTo(e.group.position)<15){b.active=false;b.mesh.visible=false;const impact=e.group.position.clone();e.hp-=b.dmg;
   if(e.hp<=0)defeatEnemy(e);else explode(impact,false);
   if(b.radius>0){splashAt(impact,b.radius);for(const other of EN){if(other===e||other.group.position.distanceTo(impact)>b.radius)continue;other.hp-=b.splash;if(other.hp<=0)defeatEnemy(other);else explode(other.group.position,false)}}
   break}}});
 // camera
 if(viewMode==='cockpit'){cam.position.copy(P).addScaledVector(fwd,3).addScaledVector(UP,1.1)}
 else{want.set(0,7,36+st.th*5).applyEuler(new THREE.Euler(st.pitch*.5,st.yaw,0,'YXZ')).add(P);cam.position.lerp(want,1-Math.exp(-dt*7))}
 cam.fov=(viewMode==='cockpit'?58:62)+st.th*8;cam.updateProjectionMatrix();
 ahead.copy(fwd.set(-Math.sin(st.yaw)*Math.cos(st.pitch),Math.sin(st.pitch),-Math.cos(st.yaw)*Math.cos(st.pitch))).multiplyScalar(240).add(P);
 cam.up.set(0,1,0);cam.lookAt(ahead);
 cam.rotateZ(-st.roll*(viewMode==='cockpit'?.9:.25));
 if(viewMode==='chase')cam.rotateX(-Math.atan(.24*Math.tan(cam.fov*Math.PI/360)));
 sky.position.copy(cam.position);ocean.position.set(P.x,0,P.z);wtex.offset.set(t0*.01,t0*.015);
 sun.position.copy(P).addScaledVector(SUN,300);sun.target.position.copy(P);
 $('stats').textContent=`Lv.${lvl}${lvl<7?'（差'+(lvl*5-kills)+'架升級）':'（滿級）'}　速度${Math.round(st.v*3.6)}　高度${Math.max(0,Math.round(P.y))}`;
 $('thr').firstElementChild.style.width=st.th*100+'%';
 ren.render(scene,cam)}
</script>
