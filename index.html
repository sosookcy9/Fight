<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>海上戰鬥機</title>
<style>
:root{box-sizing:border-box;--amber:#ffc266;--ink:#0b0d1a}
*{box-sizing:border-box}
html,body{height:100%;margin:0;background:#0b0d1a;overflow:hidden;overscroll-behavior:none;font-family:-apple-system,"PingFang TC","Noto Sans TC",sans-serif;color:#fff;touch-action:none;user-select:none;-webkit-user-select:none}
canvas{position:fixed;inset:0;width:100%;height:100%;display:block}
.btn{position:fixed;bottom:calc(env(safe-area-inset-bottom,0px) + 18px);width:76px;height:76px;border-radius:50%;border:2px solid var(--amber);background:rgba(11,13,26,.7);color:var(--amber);font-size:15px;font-weight:600}
.btn:active{background:var(--amber);color:var(--ink)}
#slow{left:16px}#fast{right:16px}
#fire{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom,0px) + 18px);width:76px;height:76px;border-radius:50%;border:2px solid #ff5c5c;background:rgba(11,13,26,.7);color:#ff9090;font-size:15px;font-weight:700}
#fire:active{background:#ff5c5c;color:#fff}
#thr{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom,0px) + 102px);width:110px;height:5px;background:rgba(255,194,102,.25);pointer-events:none}
#thr i{display:block;height:100%;background:var(--amber);width:40%}
#topbar{position:fixed;top:calc(env(safe-area-inset-top,0px) + 14px);left:0;right:0;display:flex;justify-content:space-between;padding:0 16px;pointer-events:none;text-shadow:0 0 6px #000}
#score{color:#fff;font:700 16px ui-monospace,Menlo,monospace}
#stats{color:var(--amber);font:600 13px ui-monospace,Menlo,monospace;text-align:right}
#crash{position:fixed;inset:0;background:rgba(255,80,50,.4);display:none;align-items:center;justify-content:center;font-size:28px;font-weight:700}
#ov{position:fixed;inset:0;display:flex;flex-direction:column;justify-content:center;padding:32px;background:linear-gradient(#2e7bc9,#bfe4f5 65%,#eaf7ff);gap:14px}
#ov h1{font-size:34px;margin:0;color:#0b2a4a}
#ov p{margin:0;line-height:1.6;font-size:16px;max-width:34ch;color:#0b2a4a}
#go{margin-top:8px;padding:16px;border:0;border-radius:12px;background:#ff5c5c;color:#fff;font-size:18px;font-weight:700}
</style>
</head>
<body>
<div id="topbar" hidden><span id="score">分數 0</span><span id="stats"></span></div>
<div id="thr" hidden><i></i></div>
<button class="btn" id="slow" hidden>減速</button>
<button id="fire" hidden>射擊</button>
<button class="btn" id="fast" hidden>加速</button>
<div id="crash">墜海！重新起飛中</div>
<div id="ov">
<h1>海上戰鬥機</h1>
<p>晴空萬里，海面上的空戰。手指拖曳螢幕：左右拖＝滾轉轉彎，上下拖＝拉升／俯衝，放開回正。</p>
<p>左下「減速」、右下「加速」控制油門，中間「射擊」擊落敵機得分。每擊落 5 架機槍會升級。掉進海裡會重新起飛。</p>
<button id="go">開始飛行</button>
</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
const $=id=>document.getElementById(id),cl=(v,a,b)=>Math.max(a,Math.min(b,v)),rr=(a,b)=>a+Math.random()*(b-a);
const ren=new THREE.WebGLRenderer({antialias:true});ren.setPixelRatio(Math.min(devicePixelRatio,1.75));ren.setSize(innerWidth,innerHeight);ren.shadowMap.enabled=true;document.body.prepend(ren.domElement);
const scene=new THREE.Scene();scene.fog=new THREE.Fog(0xcfeaf7,500,2600);
const cam=new THREE.PerspectiveCamera(62,innerWidth/innerHeight,.5,6000);
addEventListener('resize',()=>{ren.setSize(innerWidth,innerHeight);cam.aspect=innerWidth/innerHeight;cam.updateProjectionMatrix()});
scene.add(new THREE.HemisphereLight(0xbfe0ff,0x2a5a7a,.9));
const sun=new THREE.DirectionalLight(0xfff6da,1.2);sun.castShadow=true;sun.shadow.mapSize.set(1024,1024);
Object.assign(sun.shadow.camera,{left:-90,right:90,top:90,bottom:-90,near:1,far:400});scene.add(sun,sun.target);
const SUN=new THREE.Vector3(.35,.55,-.6).normalize();
const sky=new THREE.Mesh(new THREE.SphereGeometry(4500,24,16),new THREE.ShaderMaterial({side:THREE.BackSide,depthWrite:false,
vertexShader:'varying vec3 v;void main(){v=normalize(position);gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.);}',
fragmentShader:'varying vec3 v;void main(){float h=max(v.y,0.);vec3 zen=vec3(.16,.48,.88),hor=vec3(.78,.9,.98);vec3 c=mix(hor,zen,pow(h,.5));c+=vec3(1.,.98,.85)*pow(max(dot(v,normalize(vec3(.35,.55,-.6))),0.),80.);gl_FragColor=vec4(c,1.);}'}));
sky.renderOrder=-1;scene.add(sky);
function tex(fn,s,rep){const c=document.createElement('canvas');c.width=c.height=s;const g=c.getContext('2d');fn(g,s);const t=new THREE.CanvasTexture(c);t.wrapS=t.wrapT=THREE.RepeatWrapping;t.anisotropy=4;if(rep)t.repeat.set(rep,rep);return t}
const toonGrad=(()=>{const c=document.createElement('canvas');c.width=4;c.height=1;const g=c.getContext('2d');[70,150,210,255].forEach((v,i)=>{g.fillStyle=`rgb(${v},${v},${v})`;g.fillRect(i,0,1,1)});const t=new THREE.CanvasTexture(c);t.minFilter=t.magFilter=THREE.NearestFilter;return t})();
function outline(mesh,s){const o=new THREE.Mesh(mesh.geometry,new THREE.MeshBasicMaterial({color:0x142033,side:THREE.BackSide}));o.scale.setScalar(s||1.12);mesh.add(o)}
const wtex=tex((g,s)=>{g.fillStyle='#1fb6c9';g.fillRect(0,0,s,s);g.fillStyle='#7fe6da';
 for(let k=0;k<9;k++){const x=Math.random()*s,y=Math.random()*s,r=18+Math.random()*36;g.beginPath();g.arc(x,y,r,0,7);g.fill()}},512,20);
const ocean=new THREE.Mesh(new THREE.PlaneGeometry(20000,20000),new THREE.MeshToonMaterial({map:wtex,color:0xbfeee8,gradientMap:toonGrad}));
ocean.rotation.x=-Math.PI/2;ocean.receiveShadow=true;scene.add(ocean);
function buildJet(cMain,cDark,cCan){
 const g=new THREE.Group(),jm=new THREE.MeshToonMaterial({color:cMain,gradientMap:toonGrad}),dm=new THREE.MeshToonMaterial({color:cDark,gradientMap:toonGrad});
 const add=(geo,m,x,y,z,rx=0,rz=0)=>{const o=new THREE.Mesh(geo,m);o.position.set(x,y,z);o.rotation.set(rx,0,rz);o.castShadow=true;outline(o);g.add(o);return o};
 add(new THREE.SphereGeometry(1.55,10,8),jm,0,0,1).scale.set(1,1,3.1);
 add(new THREE.ConeGeometry(1.4,3,10),jm,0,0,-5.6,-Math.PI/2);
 const can=add(new THREE.SphereGeometry(.95,10,8),new THREE.MeshToonMaterial({color:cCan,gradientMap:toonGrad}),0,1.05,-1.5);can.scale.set(1,.85,1.9);
 const sh=new THREE.Shape();sh.moveTo(0,-2.5);sh.lineTo(6.2,2.2);sh.lineTo(6.2,3.8);sh.lineTo(0,4.2);
 const wg=new THREE.ExtrudeGeometry(sh,{depth:.5,bevelEnabled:false});
 const w2=add(wg,dm,0,0,-.5,Math.PI/2);w2.scale.x=-1;add(wg,dm,0,0,-.5,Math.PI/2);
 const s2=add(wg,dm,0,0,3.2,Math.PI/2);s2.scale.set(-.42,.42,.42);const s1=add(wg,dm,0,0,3.2,Math.PI/2);s1.scale.set(.42,.42,.42);
 add(new THREE.BoxGeometry(.3,2.6,2.2),jm,1,1.9,3.8,0,-.3);add(new THREE.BoxGeometry(.3,2.6,2.2),jm,-1,1.9,3.8,0,.3);
 const fl=new THREE.Mesh(new THREE.ConeGeometry(.85,1,8).translate(0,.5,0),new THREE.MeshBasicMaterial({color:0xffb03c,transparent:true,opacity:.9,fog:false}));fl.rotation.x=Math.PI/2;fl.position.z=5.6;g.add(fl);
 g.rotation.order='YXZ';return{group:g,flame:fl}}
const player=buildJet(0x3a7bd8,0x1f4e99,0x162a4a);scene.add(player.group);
const jet=player.group,fl=player.flame;
// enemies
const EN=[];function spawnEnemy(e){e.center=new THREE.Vector3(rr(-500,500),rr(200,420),rr(-1000,-200));e.radius=rr(70,150);e.speed=rr(.25,.55)*(Math.random()<.5?1:-1);e.angle=rr(0,6.28);e.yaw=0;e.px=e.py=e.pz=null;e.cd=rr(1,3)}
for(let k=0;k<12;k++){const j=buildJet(0xe23c3c,0x9a1f1f,0x2a1010);scene.add(j.group);const e={group:j.group,flame:j.flame};spawnEnemy(e);EN.push(e)}
// bullets
const bTex=new THREE.MeshBasicMaterial({color:0xff6a00,fog:false,transparent:true,blending:THREE.AdditiveBlending,depthWrite:false});
const BUL=Array.from({length:30},()=>({mesh:new THREE.Mesh(new THREE.CylinderGeometry(.22,.22,6,6),bTex),active:false,vel:new THREE.Vector3(),life:0}));
BUL.forEach(b=>{b.mesh.visible=false;b.mesh.geometry.rotateX(Math.PI/2);scene.add(b.mesh)});
let score=0,cooldown=0,firing=false,kills=0,lvl=1;
const LV=[{g:[-1.7,1.7],cd:.09,sc:1},{g:[-1.7,1.7],cd:.065,sc:1},{g:[-1.9,0,1.9],cd:.065,sc:1.1},{g:[-1.9,0,1.9],cd:.05,sc:1.3},{g:[-1.9,0,1.9],cd:.05,sc:1.3,splash:45}];
function checkLevel(){if(lvl<5&&kills>=lvl*5){lvl++}}
const UP=new THREE.Vector3(0,1,0),side=new THREE.Vector3();
function fireOne(off,sc){const b=BUL.find(x=>!x.active);if(!b)return;
 const cp=Math.cos(st.pitch),dir=new THREE.Vector3(-Math.sin(st.yaw)*cp,Math.sin(st.pitch),-Math.cos(st.yaw)*cp);
 side.set(Math.cos(st.yaw),0,-Math.sin(st.yaw));
 b.mesh.position.copy(P).addScaledVector(dir,6).addScaledVector(side,off).addScaledVector(UP,-.5);
 b.mesh.quaternion.setFromUnitVectors(new THREE.Vector3(0,0,1),dir);b.mesh.scale.set(sc,sc,1);
 b.vel.copy(dir).multiplyScalar(460);b.life=1.6;b.active=true;b.mesh.visible=true}
function fire(){const c=LV[lvl-1];c.g.forEach(o=>fireOne(o,c.sc))}
const eTex=new THREE.MeshBasicMaterial({color:0xff2a4a,fog:false,transparent:true,blending:THREE.AdditiveBlending,depthWrite:false});
const ENBUL=Array.from({length:20},()=>({mesh:new THREE.Mesh(new THREE.CylinderGeometry(.2,.2,5,6),eTex),active:false,vel:new THREE.Vector3(),life:0}));
ENBUL.forEach(b=>{b.mesh.visible=false;b.mesh.geometry.rotateX(Math.PI/2);scene.add(b.mesh)});
function enemyFire(e){const b=ENBUL.find(x=>!x.active);if(!b)return;
 const d=new THREE.Vector3().subVectors(P,e.group.position).normalize();
 b.mesh.position.copy(e.group.position).addScaledVector(d,4);b.mesh.quaternion.setFromUnitVectors(new THREE.Vector3(0,0,1),d);
 b.vel.copy(d).multiplyScalar(300);b.life=2.5;b.active=true;b.mesh.visible=true}
// state
const P=new THREE.Vector3(0,320,300),st={yaw:0,pitch:0,roll:0,v:70,th:.4,crash:0,tR:0,tP:0};
let dir=0,drag=false,touchId=null,startX=0,startY=0,last=0,t0=0;
function reset(){P.set(0,320,300);Object.assign(st,{yaw:0,pitch:0,roll:0,v:70,th:.4,crash:0,tR:0,tP:0});jet.visible=true;$('crash').style.display='none';cam.position.set(0,326,322)}
function start(){$('ov').style.display='none';['slow','fast','fire','thr','topbar'].forEach(i=>$(i).hidden=false);reset();last=performance.now();ren.setAnimationLoop(loop)}
$('go').onclick=start;
const hold=(b,d)=>{b.addEventListener('pointerdown',e=>{e.stopPropagation();dir=d});['pointerup','pointercancel','pointerleave'].forEach(t=>b.addEventListener(t,()=>dir=0))};hold($('fast'),1);hold($('slow'),-1);
$('fire').addEventListener('pointerdown',e=>{e.stopPropagation();firing=true});
['pointerup','pointercancel','pointerleave'].forEach(t=>$('fire').addEventListener(t,()=>firing=false));
ren.domElement.addEventListener('pointerdown',e=>{drag=true;touchId=e.pointerId;startX=e.clientX;startY=e.clientY});
addEventListener('pointerup',e=>{if(e.pointerId===touchId){drag=false;st.tR=0;st.tP=0}});
addEventListener('pointercancel',()=>{drag=false;st.tR=0;st.tP=0});
addEventListener('pointermove',e=>{if(drag&&e.pointerId===touchId){const dx=e.clientX-startX,dy=e.clientY-startY;
 st.tR=cl(dx/innerWidth*2.6,-1.4,1.4);st.tP=cl(-dy/innerHeight*1.7,-.87,.87)}});
const fwd=new THREE.Vector3(),want=new THREE.Vector3(),ahead=new THREE.Vector3();
function loop(now){const dt=Math.min(.05,(now-last)/1000);last=now;t0+=dt;
 if(st.crash>0){st.crash-=dt;if(st.crash<=0)reset()}else{
  st.th=cl(st.th+dir*dt*.6,.05,1);st.v+=((40+st.th*130)-st.v)*Math.min(1,dt*1.5);
  const k=Math.min(1,dt*5);st.roll+=(st.tR-st.roll)*k;st.pitch+=(st.tP-st.pitch)*k;st.yaw-=Math.sin(st.roll)*dt*1.1;
  const cp=Math.cos(st.pitch);fwd.set(-Math.sin(st.yaw)*cp,Math.sin(st.pitch),-Math.cos(st.yaw)*cp);
  P.addScaledVector(fwd,st.v*dt);P.y=Math.min(900,P.y);
  cooldown-=dt;if(firing&&cooldown<=0){fire();cooldown=LV[lvl-1].cd}
  if(P.y<3){st.crash=1.6;jet.visible=false;$('crash').style.display='flex'}}
 jet.position.copy(P);jet.rotation.set(st.pitch,st.yaw,-st.roll);
 const fs=.6+st.th*2.4;fl.scale.set(1,fs*(.85+Math.random()*.3),1);
 // enemies
 EN.forEach(e=>{e.angle+=e.speed*dt;const x=e.center.x+Math.cos(e.angle)*e.radius,z=e.center.z+Math.sin(e.angle)*e.radius,y=e.center.y+Math.sin(t0*.4+e.angle)*8;
  if(e.px!==null){const dx=x-e.px,dz=z-e.pz;if(Math.hypot(dx,dz)>.001)e.yaw=Math.atan2(-dx,-dz)}
  e.px=x;e.py=y;e.pz=z;
  e.group.position.set(x,y,z);e.group.rotation.set(0,e.yaw,.35*Math.sign(e.speed));
  e.flame.scale.set(1,1.4+Math.random()*.3,1);
  e.cd-=dt;if(e.cd<=0&&st.crash<=0&&P.distanceTo(e.group.position)<650){enemyFire(e);e.cd=rr(1.4,2.8)}});
 // enemy bullets
 ENBUL.forEach(b=>{if(!b.active)return;b.mesh.position.addScaledVector(b.vel,dt);b.life-=dt;
  if(b.life<=0||b.mesh.position.y<0){b.active=false;b.mesh.visible=false;return}
  if(st.crash<=0&&b.mesh.position.distanceTo(P)<9){b.active=false;b.mesh.visible=false;st.crash=1.6;jet.visible=false;$('crash').style.display='flex'}});
 // bullets
 BUL.forEach(b=>{if(!b.active)return;b.mesh.position.addScaledVector(b.vel,dt);b.life-=dt;
  if(b.life<=0||b.mesh.position.y<0){b.active=false;b.mesh.visible=false;return}
  for(const e of EN){if(b.mesh.position.distanceTo(e.group.position)<15){b.active=false;b.mesh.visible=false;score+=10;kills++;checkLevel();
   const splash=LV[lvl-1].splash;if(splash)EN.forEach(o=>{if(o!==e&&o.group.position.distanceTo(e.group.position)<splash){score+=10;kills++;checkLevel();spawnEnemy(o)}});
   $('score').textContent='分數 '+score;spawnEnemy(e);break}}});
 // chase cam
 want.set(0,4.5,24+st.th*4).applyEuler(new THREE.Euler(st.pitch*.5,st.yaw,0,'YXZ')).add(P);
 cam.position.lerp(want,1-Math.exp(-dt*7));
 ahead.copy(fwd.set(-Math.sin(st.yaw)*Math.cos(st.pitch),Math.sin(st.pitch),-Math.cos(st.yaw)*Math.cos(st.pitch))).multiplyScalar(40).add(P);
 cam.up.set(0,1,0);cam.lookAt(ahead);cam.rotateZ(-st.roll*.25);
 cam.fov=62+st.th*8;cam.updateProjectionMatrix();
 sky.position.copy(cam.position);ocean.position.set(P.x,0,P.z);wtex.offset.set(t0*.01,t0*.015);
 sun.position.copy(P).addScaledVector(SUN,300);sun.target.position.copy(P);
 $('stats').textContent=`Lv.${lvl}${lvl<5?'（差'+(lvl*5-kills)+'架升級）':'（滿級）'}　速度${Math.round(st.v*3.6)}　高度${Math.max(0,Math.round(P.y))}`;
 $('thr').firstElementChild.style.width=st.th*100+'%';
 ren.render(scene,cam)}
</script>
</body>
</html>
